<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeOS · 我的白板</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header id="board-navigation">
<div id="canvas-actions" aria-label="白板操作">
  <button id="canvas-add" class="canvas-action canvas-add" data-add-module aria-label="添加模块" title="添加模块">+</button>
  <button id="canvas-inbox" class="canvas-action canvas-inbox" data-open-inbox aria-label="打开收件箱" title="打开收件箱"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14l1.5 9.5v5.5h-17V14L5 4.5Z"></path><path d="M3.8 14h4.7l1.2 2h4.6l1.2-2h4.7"></path></svg></button>
  <button id="canvas-pomodoro" class="canvas-action canvas-pomodoro" data-open-pomodoro aria-label="打开番茄钟" title="番茄钟"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"></circle><path d="M9.5 3.5h5M12 5.5v2M12 13l3-2"></path></svg><span id="pomodoro-badge" hidden></span></button>
  <button id="canvas-more" class="canvas-action canvas-more" data-open-theme aria-label="主题设置" title="主题设置">...</button>
</div>
<nav id="module-tabs" aria-label="模块标签页"></nav>
</header>
<div id="viewport" aria-label="无边白板"><div id="workspace"></div></div>
<dialog id="inbox-dialog" class="inbox-dialog"><form id="inbox-form"><div class="dialog-head"><h2 id="inbox-heading">原始收件箱</h2><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><p class="hint">随便写，暂时不分类。已保存的条目可以继续编辑；Codex 处理成功后才会移出待处理列表。</p><textarea id="inbox-body" class="inbox-body" aria-label="原始内容" placeholder="把想到的事情、混乱的记录或购物信息直接丢进来…" rows="6"></textarea><div id="inbox-attachments"></div><label class="attachment-control">＋ 添加图片或附件<input id="inbox-file" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt"></label><p id="inbox-error" class="error" role="alert"></p><div class="inbox-pending"><div class="property-heading"><span>等待整理</span><span id="inbox-count"></span></div><div id="inbox-list"></div></div><div class="dialog-actions"><button type="button" class="quiet" id="cancel-inbox-edit" hidden>取消编辑</button><span></span><button type="button" class="quiet" data-close>关闭</button><button type="submit" class="primary" id="save-inbox">存入收件箱</button></div></form></dialog>
<dialog id="theme-dialog" class="theme-dialog"><div class="dialog-head"><h2>选择主题</h2><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><p class="hint">主题会统一调整白板、模块、文字、边框和悬浮按钮。</p><div class="theme-grid"><button type="button" class="theme-card" data-theme="light"><span class="theme-preview theme-preview-light"><i></i><i></i></span><strong>纯白</strong><small>清晰、明亮</small></button><button type="button" class="theme-card" data-theme="paper"><span class="theme-preview theme-preview-paper"><i></i><i></i></span><strong>暖纸</strong><small>柔和、自然</small></button><button type="button" class="theme-card" data-theme="mist"><span class="theme-preview theme-preview-mist"><i></i><i></i></span><strong>雾灰</strong><small>安静、克制</small></button><button type="button" class="theme-card" data-theme="midnight"><span class="theme-preview theme-preview-midnight"><i></i><i></i></span><strong>深夜</strong><small>低亮度深色</small></button></div></dialog>
<dialog id="pomodoro-dialog" class="pomodoro-dialog"><div class="dialog-head"><h2>番茄钟</h2><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><input type="hidden" id="pomodoro-mode" value="countdown"><div id="timer-segments" class="timer-segments" role="group" aria-label="计时模式"><span class="segment-indicator" aria-hidden="true"></span><button type="button" data-timer-mode="countdown" aria-pressed="true">倒计时</button><button type="button" data-timer-mode="countup" aria-pressed="false">正计时</button></div><div class="pomodoro-clock" aria-live="polite"><div id="pomodoro-time">25:00</div><p id="pomodoro-status">准备专注</p></div><div class="pomodoro-settings"><label>专注内容<input id="pomodoro-label" maxlength="120" placeholder="例如：完成 Planning 作业"></label><label>分钟<input id="pomodoro-duration" type="number" min="1" max="180" value="25" inputmode="numeric"></label></div><button type="button" class="quiet" id="pomodoro-save-label" hidden>保存专注内容</button><p id="pomodoro-error" class="error" role="alert"></p><div class="pomodoro-controls"><button type="button" class="primary" id="pomodoro-start">开始专注</button><button type="button" class="quiet" id="pomodoro-pause" hidden>暂停</button><button type="button" class="quiet danger" id="pomodoro-finish" hidden>结束</button></div></dialog>
<dialog id="focus-edit-dialog"><form id="focus-edit-form"><div class="dialog-head"><h2>编辑专注记录</h2><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><label>专注内容<input id="focus-edit-label" maxlength="120"></label><div class="pomodoro-settings"><label>分钟<input id="focus-edit-minutes" type="number" min="0" max="525600" step="1" required></label><label>秒<input id="focus-edit-seconds" type="number" min="0" max="59" step="1" required></label></div><p id="focus-edit-error" class="error"></p><div class="dialog-actions"><button type="button" class="quiet danger" id="focus-delete">删除记录</button><span></span><button type="submit" class="primary">保存</button></div></form></dialog><dialog id="utility-dialog"><div class="dialog-head"><span></span><button class="icon-button" data-close aria-label="关闭">×</button></div><div id="utility-content"></div></dialog>
<dialog id="module-dialog"><form id="module-form"><div class="dialog-head"><h2 id="module-heading">添加一个模块</h2><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><p class="hint">每个模块独立收纳一类记录。之后可以改名、添加属性和调整位置。</p><label>从哪里开始<select id="module-kind" name="kind"><option value="journal">每日记录</option><option value="health">健康记录</option><option value="shopping">购物记录</option><option value="plans">计划</option><option value="custom">空白模块</option></select></label><label>模块名称<input id="module-name" name="name" required maxlength="80" placeholder="例如：阅读记录"></label><label>展示方式<select id="module-view" name="view"><option value="list">列表</option><option value="table">表格</option></select></label><div class="property-heading"><span>自定义属性</span><button type="button" class="quiet" id="add-field">＋ 添加属性</button></div><p class="hint compact">日期、名称和内容已包含在每条记录中。</p><div id="field-list"></div><p id="module-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet" data-page="data">数据与导出</button><span></span><button type="button" class="quiet" data-close>取消</button><button class="primary" type="submit" id="save-module">创建模块</button></div></form></dialog>
<dialog id="record-dialog" class="record-dialog"><form id="record-form"><div class="dialog-head"><span class="hint" id="record-heading">新的记录</span><button type="button" class="icon-button" data-close aria-label="关闭">×</button></div><input class="record-title" name="title" aria-label="记录标题" placeholder="无标题" required maxlength="200"><div class="record-properties"><label>所属模块<select name="module_id" id="record-module"></select></label><label>日期<input type="date" name="date" required></label><label id="status-label">状态<select name="status"><option value="todo">未完成</option><option value="done">已完成</option></select></label><label id="amount-label">金额<input name="amount" inputmode="decimal" placeholder="未知留空"></label><label id="currency-label">币种<input name="currency" placeholder="例如 CNY"></label><div id="custom-properties"></div></div><textarea class="record-body" name="body" aria-label="记录内容" placeholder="在这里写下内容…" rows="7"></textarea><div id="record-attachments"></div><label class="attachment-control">＋ 添加图片或附件<input id="attachment-input" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt"></label><div id="related-records"></div><p id="record-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="quiet danger" id="delete-record">移到回收站</button><span></span><button type="button" class="quiet" data-close>取消</button><button type="submit" class="primary" id="save-record">保存</button></div></form></dialog>
<dialog id="import-dialog"><div class="dialog-head"><h2>导入记录或备份</h2><button class="icon-button" data-close aria-label="关闭">×</button></div><p class="hint">可以导入整个白板，也可以只导入一个模块。相同编号默认跳过。</p><label>整理结果<textarea id="import-text" rows="8" placeholder="粘贴整理后的 JSON"></textarea></label><label>或选择备份文件<input type="file" id="import-file" accept=".json,.zip"></label><label class="inline-label"><input type="checkbox" id="overwrite">更新相同编号的模块和记录</label><p id="import-error" class="error" role="alert"></p><div class="dialog-actions"><button class="quiet" id="copy-prompt">复制整理指令</button><span></span><button class="primary" id="run-import">导入</button></div></dialog>
<div id="toast" role="status" hidden></div><script src="/app.js"></script></body></html>
